<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/animation.css">

</head>

<body>

<div class="login-page">

<div class="login-card fade-in">

<div class="logo">

🏦

</div>

<h2>Welcome Back</h2>

<p>Sign in to your account</p>

<form id="loginForm">

<label>Email Address</label>

<input
type="email"
id="username"
placeholder="Enter your email"
required>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<button
type="submit"
class="btn">

Login

</button>

</form>

<div style="margin-top:20px;text-align:center;">

<a href="#" id="forgotPassword">

Forgot Password?

</a>

</div>

<div style="margin-top:20px;text-align:center;">

<p style="font-size:16px; line-height:1.7; color:#444;">
  After logging in, go to your
  <strong style="color:#0d6efd;">Profile</strong> page and
  <strong style="color:#dc3545;">change the default PIN</strong> to a
  <strong style="color:#198754;">new PIN of your choice</strong> to keep your account secure.
</p>

</p>

</div>

</div>

</div>



</div>

<script type="module" src="js/auth.js"></script>
</body>

</html>
