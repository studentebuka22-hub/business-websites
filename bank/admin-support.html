<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Live Support</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
background:#edf2f7;
overflow:hidden;
}

.container{
display:flex;
height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

width:360px;
background:#fff;
display:flex;
flex-direction:column;
border-right:1px solid #ddd;

}

.header{

height:70px;
background:#0d6efd;
color:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;

}

.header h2{

font-size:22px;

}

.search{

padding:15px;

border-bottom:1px solid #eee;

}

.search input{

width:100%;
height:45px;
border:none;
outline:none;
background:#f3f4f6;
border-radius:25px;
padding:0 18px;

}

.userList{

flex:1;
overflow-y:auto;

}

.userCard{

display:flex;
gap:12px;
padding:15px;
cursor:pointer;
border-bottom:1px solid #f2f2f2;
transition:.25s;

}

.userCard:hover{

background:#f7faff;

}

.userCard.active{

background:#dbeafe;

}

.avatar{

width:55px;
height:55px;
border-radius:50%;
background:#0d6efd;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
position:relative;

}

.online{

position:absolute;
right:0;
bottom:0;
width:14px;
height:14px;
background:#22c55e;
border-radius:50%;
border:2px solid white;

}

.userInfo{

flex:1;

}

.userInfo h3{

font-size:16px;

}

.userInfo p{

font-size:13px;
color:#666;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

.time{

font-size:11px;
color:#999;
margin-top:5px;

}

.badge{

background:#ef4444;
color:#fff;
padding:3px 8px;
border-radius:20px;
font-size:11px;
font-weight:bold;
margin-top:6px;
display:inline-block;

}

/* =========================
   CHAT AREA
========================= */

.chatSection{

flex:1;
display:flex;
flex-direction:column;
background:#e9eef5;

}

.chatHeader{

height:70px;
background:#fff;
display:flex;
align-items:center;
padding:0 20px;
border-bottom:1px solid #ddd;

}

.chatHeader h2{

font-size:20px;

}

.chatHeader p{

font-size:13px;
color:#666;
margin-top:3px;

}

.chatBox{

flex:1;
overflow-y:auto;
padding:20px;

}

.empty{

height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:#777;
text-align:center;

}

.empty h2{

margin-top:15px;

}

.empty p{

margin-top:10px;
max-width:350px;
line-height:1.6;

}

.typing{

display:none;
padding:10px 20px;
font-size:13px;
background:#fff;
color:#666;

}

.footer{

background:#fff;
padding:12px;
display:flex;
gap:10px;
border-top:1px solid #ddd;

}

.footer input{

flex:1;
height:50px;
border:none;
background:#f3f4f6;
border-radius:25px;
padding:0 18px;
outline:none;

}

.footer button{

width:60px;
border:none;
background:#0d6efd;
color:#fff;
border-radius:50%;
font-size:22px;
cursor:pointer;

}

.message{

display:flex;
margin-bottom:14px;

}

.message.admin{

justify-content:flex-end;

}

.message.user{

justify-content:flex-start;

}

.bubble{

max-width:75%;
padding:12px 15px;
border-radius:18px;
font-size:15px;
line-height:1.5;

}

.admin .bubble{

background:#0d6efd;
color:#fff;
border-bottom-right-radius:6px;

}

.user .bubble{

background:#fff;
border-bottom-left-radius:6px;

}

.msgTime{

display:block;
font-size:11px;
opacity:.7;
margin-top:5px;
text-align:right;

}

@media(max-width:768px){

.sidebar{

width:100%;

}

.chatSection{

display:none;

}

.chatSection.show{

display:flex;
position:fixed;
inset:0;
z-index:999;
background:#e9eef5;

}

}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="header">

<h2>

Support Center

</h2>

<div>

👨‍💼

</div>

</div>

<div class="search">

<input
type="text"
id="searchUser"
placeholder="Search customer...">

</div>

<div
class="userList"
id="userList">

<!-- Firebase customers appear here -->

</div>

</div>

<!-- CHAT -->

<div
class="chatSection"
id="chatSection">

<div class="chatHeader">

<div>

<h2 id="customerName">

Select Customer

</h2>

<p id="customerStatus">

Waiting...

</p>

</div>

</div>

<div
class="typing"
id="typingIndicator">

Customer is typing...

</div>

<div
class="chatBox"
id="chatBox">

<div
class="empty"
id="empty">

<div style="font-size:80px;">

💬

</div>

<h2>

No Conversation Selected

</h2>

<p>

Select a customer from the left to begin chatting.

</p>

</div>

</div>

<div class="footer">

<input
type="text"
id="replyMessage"
placeholder="Type reply...">

<button
id="sendReply">

➤

</button>

</div>

<script type="module">
   import {
    auth,
    db,
    ref,
    get,
    set,
    push,
    update,
    onValue,
    query,
    orderByChild
} from "./js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =====================================
   VARIABLES
===================================== */

let selectedUID = null;
let selectedCustomer = null;

/* Notification-sound tracking state (does not affect existing chat logic) */
let previousChatStates = {};      // uid -> last known updatedAt, used to detect new messages in unopened chats
let isFirstCustomersLoad = true;  // prevents sound firing on initial page load
let previousMessageIds = new Set(); // ids already rendered in the currently open chat
let isFirstMessagesLoad = true;   // prevents sound firing when a conversation is first opened

const userList = document.getElementById("userList");
const chatBox = document.getElementById("chatBox");
const empty = document.getElementById("empty");

const customerName =
document.getElementById("customerName");

const customerStatus =
document.getElementById("customerStatus");

const replyMessage =
document.getElementById("replyMessage");

const sendReply =
document.getElementById("sendReply");

/* =====================================
   ADMIN LOGIN
===================================== */

onAuthStateChanged(auth,async(user)=>{

    if(!user){

        location.href="login.html";
        return;

    }

    loadCustomers();

});

/* =====================================
   LOAD CUSTOMERS
===================================== */

function loadCustomers(){

    onValue(

        query(
            ref(db,"supportChats"),
            orderByChild("updatedAt")
        ),

        function(snapshot){

            userList.innerHTML="";

            if(!snapshot.exists()){

                userList.innerHTML=`

                <div style="padding:30px;text-align:center;color:#888;">

                    No customer chats yet.

                </div>

                `;

                return;

            }

            const chats=[];

            let hasNewMessageElsewhere = false;

            snapshot.forEach(function(child){

                const uid = child.key;

                const data = child.val();

                chats.unshift({

                    uid:uid,

                    ...data

                });

                if(

                    !isFirstCustomersLoad &&

                    previousChatStates[uid]!==undefined &&

                    data.updatedAt!==previousChatStates[uid] &&

                    uid!==selectedUID

                ){

                    hasNewMessageElsewhere = true;

                }

                previousChatStates[uid] = data.updatedAt;

            });

            chats.forEach(createCustomerCard);

            if(hasNewMessageElsewhere){

                playNotificationSound();

            }

            isFirstCustomersLoad = false;

        }

    );

}

/* =====================================
   CUSTOMER CARD
===================================== */

function createCustomerCard(data){

    const card=document.createElement("div");

    card.className="userCard";

    card.dataset.uid=data.uid;

    const customer=
    data.customer || {};

    const name=

    customer.name ||

    customer.fullname ||

    customer.email ||

    "Customer";

    const email=

    customer.email ||

    "";

    const online=

    customer.online

    ?"<span class='online'></span>"

    :"";

    card.innerHTML=`

        <div class="avatar">

            ${name.charAt(0).toUpperCase()}

            ${online}

        </div>

        <div class="userInfo">

            <h3>${name}</h3>

            <p>${data.lastMessage||"No messages yet"}</p>

            <div class="time">

            ${formatTime(data.updatedAt)}

            </div>

        </div>

    `;

    card.onclick=function(){

        document

        .querySelectorAll(".userCard")

        .forEach(c=>c.classList.remove("active"));

        card.classList.add("active");

        selectedUID=data.uid;

        selectedCustomer=data;

        openConversation();

    };

    userList.appendChild(card);

}

/* =====================================
   OPEN CHAT
===================================== */

function openConversation(){

    document

    .getElementById("chatSection")

    .classList.add("show");

    chatBox.innerHTML="";

    customerName.textContent=

    selectedCustomer.customer?.name ||

    selectedCustomer.customer?.email ||

    "Customer";

    customerStatus.textContent=

    selectedCustomer.customer?.online

    ?"Online"

    :"Offline";

    loadMessages();

}

/* =====================================
   LOAD MESSAGES
===================================== */

function loadMessages(){

    previousMessageIds = new Set();

    isFirstMessagesLoad = true;

    onValue(

        query(

            ref(

                db,

                "supportChats/"+

                selectedUID+

                "/messages"

            ),

            orderByChild("time")

        ),

        function(snapshot){

            chatBox.innerHTML="";

            if(!snapshot.exists()){

                chatBox.appendChild(empty);

                return;

            }

            const currentIds = new Set();

            let hasNewUserMessage = false;

            snapshot.forEach(function(child){

                currentIds.add(child.key);

                if(

                    !isFirstMessagesLoad &&

                    !previousMessageIds.has(child.key) &&

                    child.val().sender==="user"

                ){

                    hasNewUserMessage = true;

                }

                createBubble(

                    child.key,

                    child.val()

                );

            });

            if(hasNewUserMessage){

                playNotificationSound();

            }

            previousMessageIds = currentIds;

            isFirstMessagesLoad = false;

            chatBox.scrollTop=

            chatBox.scrollHeight;

        }

    );

}

/* =====================================
   MESSAGE BUBBLE
===================================== */

function createBubble(id,data){

    const row=

    document.createElement("div");

    row.className=

    "message "+data.sender;

    row.dataset.id=id;

    row.innerHTML=`

        <div class="bubble">

            ${data.text}

            <span class="msgTime">

                ${formatTime(data.time)}

            </span>

        </div>

    `;

    chatBox.appendChild(row);

}

/* =====================================
   TIME
===================================== */

function playNotificationSound(){

    try{

        const AudioCtx = window.AudioContext || window.webkitAudioContext;

        const audioCtx = new AudioCtx();

        const oscillator = audioCtx.createOscillator();

        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(audioCtx.destination);

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);

        oscillator.frequency.setValueAtTime(1046.5, audioCtx.currentTime + 0.12);

        gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);

        gainNode.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);

        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);

        oscillator.start(audioCtx.currentTime);

        oscillator.stop(audioCtx.currentTime + 0.4);

        oscillator.onended = function(){

            audioCtx.close();

        };

    }catch(e){

        console.warn("Notification sound could not be played:",e);

    }

}

function formatTime(time){

    if(!time) return "";

    return new Date(time)

    .toLocaleTimeString([],{

        hour:"2-digit",

        minute:"2-digit"

    });

}
   /* =====================================
   SEND ADMIN REPLY
===================================== */

sendReply.onclick = sendReplyMessage;

replyMessage.addEventListener(

    "keypress",

    function(e){

        if(e.key==="Enter"){

            e.preventDefault();

            sendReplyMessage();

        }

    }

);

async function sendReplyMessage(){

    if(!selectedUID) return;

    const text = replyMessage.value.trim();

    if(text==="") return;

    const messageRef = push(

        ref(
            db,
            "supportChats/" +
            selectedUID +
            "/messages"
        )

    );

    await set(

        messageRef,

        {

            sender:"admin",

            text:text,

            time:Date.now(),

            read:false

        }

    );

    await update(

        ref(
            db,
            "supportChats/" +
            selectedUID
        ),

        {

            lastMessage:text,

            updatedAt:Date.now()

        }

    );

    replyMessage.value="";

}

/* =====================================
   CUSTOMER TYPING
===================================== */

onValue(

    ref(
        db,
        "supportChats/" +
        selectedUID +
        "/userTyping"
    ),

    function(snapshot){

        const typing =
        document.getElementById(
            "typingIndicator"
        );

        typing.style.display =
        snapshot.val()
        ? "block"
        : "none";

    }

);

/* =====================================
   ADMIN TYPING
===================================== */

let typingTimer;

replyMessage.addEventListener(

    "input",

    function(){

        if(!selectedUID) return;

        update(

            ref(
                db,
                "supportChats/" +
                selectedUID
            ),

            {

                adminTyping:true

            }

        );

        clearTimeout(typingTimer);

        typingTimer = setTimeout(function(){

            update(

                ref(
                    db,
                    "supportChats/" +
                    selectedUID
                ),

                {

                    adminTyping:false

                }

            );

        },1000);

    }

);

/* =====================================
   SEARCH CUSTOMER
===================================== */

document

.getElementById("searchUser")

.addEventListener(

    "keyup",

    function(){

        const keyword =
        this.value
        .toLowerCase();

        document

        .querySelectorAll(".userCard")

        .forEach(function(card){

            card.style.display =

            card.innerText
            .toLowerCase()
            .includes(keyword)

            ? "flex"

            : "none";

        });

    }

);

/* =====================================
   AUTO SCROLL
===================================== */

const observer =
new MutationObserver(function(){

    chatBox.scrollTop =
    chatBox.scrollHeight;

});

observer.observe(

    chatBox,

    {

        childList:true

    }

);

/* =====================================
   CLOSE SCRIPT
===================================== */

</script>

</body>

</html>
