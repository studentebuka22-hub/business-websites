<section class="balanceCard fade-in">

<div class="cardTop">

<span>Total Balance</span>



</div>

<h1 id="balance">
    <span class="loadingBalance">Loading...</span>
</h1>

<style>

.loadingBalance{

display:inline-block;

color:#94a3b8;

font-size:inherit;

font-weight:700;

font-style:italic;

animation:loadingPulse 1.2s ease-in-out infinite;

}

@keyframes loadingPulse{

0%{

opacity:.35;

}

50%{

opacity:1;

}

100%{

opacity:.35;

}

}

</style>

<div class="cardInfo">

<div>

<small>Card Holder</small>

<h3 id="cardHolder">Loading...</h3>

</div>

<div>

<small>Card Number</small>

<h3 id="dashboardCardNumber">
    Loading...
</h3>

<script type="module">
import {
    auth,
    db,
    ref,
    get
} from "./js/firebase.js";

auth.onAuthStateChanged(async (user) => {

    if (!user) return;

    try {

        const snapshot = await get(
            ref(db, "users/" + user.uid)
        );

        if (!snapshot.exists()) return;

        const data = snapshot.val();

        let cardNumber = String(
            data.cardNumber || "0000000000000000"
        ).replace(/\s/g, "");

        cardNumber = cardNumber
            .replace(/(.{4})/g, "$1 ")
            .trim();

        document.getElementById("dashboardCardNumber").textContent = cardNumber;

    } catch (err) {

        console.error(err);

        document.getElementById("dashboardCardNumber").textContent =
            "**** **** **** ****";

    }

});
</script>

</div>
