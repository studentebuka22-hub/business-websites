<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Delete User Manager</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#dc3545;
color:#fff;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.searchBox{
margin-bottom:20px;
}

.searchBox input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

thead{
background:#dc3545;
color:white;
}

th,td{
padding:15px;
text-align:left;
border-bottom:1px solid #eee;
}

tbody tr:hover{
background:#fafafa;
}

.deleteBtn{
background:#dc3545;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.deleteBtn:hover{
background:#bb2d3b;
}

#loading{
padding:40px;
text-align:center;
font-size:18px;
color:#777;
}

.modal{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.55);
z-index:99999;
}

.modalBox{
background:#fff;
width:95%;
max-width:420px;
border-radius:12px;
padding:25px;
}

.modalBox h2{
color:#dc3545;
margin-bottom:20px;
text-align:center;
}

.modalBox p{
line-height:1.7;
margin-bottom:15px;
}

.modalBox input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-top:8px;
margin-bottom:15px;
}

.actions{
display:flex;
gap:10px;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.confirmDelete{
background:#dc3545;
color:white;
}

.cancelDelete{
background:#6c757d;
color:white;
}

@media(max-width:700px){

table,
thead,
tbody,
tr,
td,
th{
display:block;
}

thead{
display:none;
}

tr{
margin-bottom:15px;
padding:12px;
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

td{
border:none;
padding:8px 0;
}

td:nth-child(1)::before{
content:"Name";
display:block;
font-size:12px;
font-weight:bold;
}

td:nth-child(2)::before{
content:"Email";
display:block;
font-size:12px;
font-weight:bold;
}

td:nth-child(3)::before{
content:"Account";
display:block;
font-size:12px;
font-weight:bold;
}

td:nth-child(4)::before{
content:"Action";
display:block;
font-size:12px;
font-weight:bold;
}

}

</style>

</head>

<body>

<header>

Delete User Manager

</header>

<div class="container">

<div class="searchBox">

<input
type="text"
id="search"
placeholder="Search by name, email or account number...">

</div>

<div id="loading">

Loading users...

</div>

<table id="userTable" style="display:none;">

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Account Number</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="userBody">

</tbody>

</table>

</div>

<div class="modal" id="deleteModal">

<div class="modalBox">

<h2>Delete User</h2>

<p>

This action will permanently remove this user's information from the Firebase Realtime Database.

</p>

<input
id="deleteName"
readonly>

<input
id="deleteAccount"
readonly>

<div class="actions">

<button
class="confirmDelete"
id="confirmDelete">

Delete User

</button>

<button
class="cancelDelete"
id="cancelDelete">

Cancel

</button>

</div>

</div>

</div>

<script type="module">

import{

auth,
db,
ref,
onValue,
remove

}from"./js/firebase.js";

let users=[];

let selectedUID="";

function loadUsers(){
      onValue(

        ref(db,"users"),

        function(snapshot){

            const body =
            document.getElementById("userBody");

            const table =
            document.getElementById("userTable");

            const loading =
            document.getElementById("loading");

            body.innerHTML="";

            users=[];

            if(!snapshot.exists()){

                loading.innerHTML="No users found.";

                return;

            }

            loading.style.display="none";
            table.style.display="table";

            snapshot.forEach(function(child){

                const user=child.val();

                user.uid=child.key;

                users.push(user);

            });

            renderUsers(users);

        }

    );

}

auth.onAuthStateChanged(function(user){

    if(!user){

        window.location.href="login.html";

        return;

    }

    loadUsers();

});

function renderUsers(list){

    const body=
    document.getElementById("userBody");

    body.innerHTML="";

    list.forEach(function(user){

        body.innerHTML += `

        <tr>

            <td>

                ${user.fullname || user.name || ""}

            </td>

            <td>

                ${user.email || ""}

            </td>

            <td>

                ${user.accountNumber || ""}

            </td>

            <td>

                <button
                class="deleteBtn"
                onclick="openDelete('${user.uid}')">

                Delete

                </button>

            </td>

        </tr>

        `;

    });

}

document
.getElementById("search")
.addEventListener("keyup",function(){

    const keyword=
    this.value.toLowerCase();

    const filtered=
    users.filter(function(user){

        return(

            (user.fullname || "")
            .toLowerCase()
            .includes(keyword)

            ||

            (user.name || "")
            .toLowerCase()
            .includes(keyword)

            ||

            (user.email || "")
            .toLowerCase()
            .includes(keyword)

            ||

            String(
                user.accountNumber || ""
            )
            .includes(keyword)

        );

    });

    renderUsers(filtered);

});

window.openDelete=function(uid){

    selectedUID=uid;

    const user=
    users.find(function(u){

        return u.uid===uid;

    });

    if(!user) return;

    document
    .getElementById("deleteName")
    .value=
    user.fullname || user.name || "";

    document
    .getElementById("deleteAccount")
    .value=
    user.accountNumber || "";

    document
    .getElementById("deleteModal")
    .style.display="flex";

};

document
.getElementById("cancelDelete")
.onclick=function(){

    document
    .getElementById("deleteModal")
    .style.display="none";

};
  document
.getElementById("confirmDelete")
.onclick = async function(){

    if(selectedUID==="") return;

    const confirmed = confirm(

        "WARNING!\n\n" +

        "This will permanently delete this user from the Realtime Database.\n\n" +

        "Continue?"

    );

    if(!confirmed) return;

    try{

        /* Delete user profile */

        await remove(

            ref(db,"users/" + selectedUID)

        );

        /* Delete transaction history */

        await remove(

            ref(db,"transactions/" + selectedUID)

        );

        /* Close dialog */

        document
        .getElementById("deleteModal")
        .style.display="none";

        selectedUID="";

        alert(

            "User deleted successfully."

        );

    }catch(error){

        console.error(error);

        alert(

            "Delete failed.\n\n" +

            error.message

        );

    }

};

window.onclick=function(event){

    const modal=

    document.getElementById("deleteModal");

    if(event.target===modal){

        modal.style.display="none";

    }

};

</script>

</body>
</html>
