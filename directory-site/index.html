<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory</title>
<meta name="description" content="A dynamic directory of pages and links.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-aurora"></div>

<div class="loader-overlay" id="pageLoader">
  <div class="loader-ring"></div>
  <span>Loading directory…</span>
</div>

<div class="container-narrow">

  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-mark" id="brandMark"><i class="bi bi-signpost-2"></i></span>
      <span id="brandText">Directory</span>
    </a>
    <div class="topbar-actions">
      <button class="theme-toggle" id="themeToggleBtn" title="Toggle theme">
        <i class="bi bi-moon-stars" id="themeToggleIcon"></i>
      </button>
    </div>
  </header>

  <section class="hero">
    <span class="hero-eyebrow">Directory</span>
    <h1>Welcome to <span id="heroSiteTitle">the directory</span></h1>
    <p class="lead" id="heroLead">Everything is organized below — pick a card to get started.</p>
  </section>

  <nav class="crumb-trail" id="crumbTrail" aria-label="Breadcrumb"></nav>

  <div class="page-nav-row d-none" id="pageNavRow"></div>

  <div class="page-title-block" id="pageTitleBlock"></div>

  <main id="pageRoot" class="tiles-grid"></main>

  <footer class="site-footer">
    <span id="footerText">© Directory</span>
  </footer>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase compat SDK — works directly from file://, no server/module needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<!-- App scripts, in dependency order -->
<script src="js/firebase.js"></script>
<script src="js/helpers.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/buttons.js"></script>
<script src="js/directory.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () { DirectoryApp.init(); });
</script>
</body>
</html>
