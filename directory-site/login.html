<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · Directory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-aurora"></div>

<div class="loader-overlay" id="pageLoader">
  <div class="loader-ring"></div>
  <span>Checking session…</span>
</div>

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark"><i class="bi bi-signpost-2"></i></div>
    <h1>Admin sign in</h1>
    <p class="sub">Manage pages, buttons, and settings.</p>

    <form id="loginForm" novalidate>
      <div class="form-floating-custom">
        <label for="email">Email</label>
        <input type="email" class="form-control-custom" id="email" name="email" required autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="form-floating-custom">
        <label for="password">Password</label>
        <input type="password" class="form-control-custom" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-brand" id="loginSubmitBtn">
        <span id="loginSubmitLabel">Sign in</span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0"><a href="index.html" class="text-body-secondary small"><i class="bi bi-arrow-left"></i> Back to directory</a></p>
  </div>
</div>

<!-- Firebase compat SDK — works directly from file://, no server/module needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/helpers.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>

<script>
  Auth.redirectIfAlreadyAuthed();
  // If nothing redirects within a moment, reveal the login form.
  setTimeout(UI.hideLoader, 400);

  document.querySelector("#loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = e.target.email.value.trim();
    var password = e.target.password.value;
    var btn = document.querySelector("#loginSubmitBtn");
    var label = document.querySelector("#loginSubmitLabel");

    btn.disabled = true;
    label.textContent = "Signing in…";
    Auth.login(email, password).then(function () {
      window.location.href = "admin.html";
    }).catch(function (err) {
      UI.showToast(err.message, "error");
      btn.disabled = false;
      label.textContent = "Sign in";
    });
  });
</script>
</body>
</html>
