<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Peace Mentorary International Academy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <span class="crest">P</span>
      <span class="brand-name">Peace Mentorary<span>Admin Panel</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">&larr; Back to Website</a>
    </nav>
  </div>
</header>

<div id="login-box" class="login-box">
  <span class="eyebrow">Staff Login</span>
  <h2>Admin Sign In</h2>
  <form id="login-form" class="stack">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div id="login-msg" class="form-msg"></div>
    <button type="submit" class="btn btn-primary">Sign In</button>
  </form>
  <p style="font-size:.8rem;color:var(--ink-soft);margin-top:14px;">Admin accounts are created in the Firebase Console under Authentication &rarr; Users. There is no public sign-up.</p>
</div>

<div id="dashboard" class="admin-shell" style="display:none;">
  <div class="admin-topbar">
    <div>
      <span class="eyebrow">Signed in as</span>
      <h2 id="admin-email" style="margin:0;font-size:1.1rem;"></h2>
    </div>
    <button id="logout-btn" class="btn btn-outline" style="border-color:var(--primary);color:var(--primary);">Sign Out</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-target="panel-inquiries">Admission Inquiries (<span id="inquiries-count">0</span>)</button>
    <button class="tab-btn" data-target="panel-messages">Contact Messages (<span id="messages-count">0</span>)</button>
  </div>

  <div id="panel-inquiries" class="tab-panel" style="display:block;overflow-x:auto;">
    <table class="data-table">
      <thead>
        <tr>
          <th>Date</th><th>Parent</th><th>Child</th><th>Class</th><th>Email</th><th>Message</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="inquiries-body">
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="panel-messages" class="tab-panel" style="display:none;overflow-x:auto;">
    <table class="data-table">
      <thead>
        <tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Message</th></tr>
      </thead>
      <tbody id="messages-body">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
