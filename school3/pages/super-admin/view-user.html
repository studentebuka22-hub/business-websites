<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

User Profile | MathCloud Tutorial Academy

</title>

<link rel="icon"
href="../../assets/images/logo/favicon.png">

<link rel="stylesheet"
href="../../assets/css/reset.css">

<link rel="stylesheet"
href="../../assets/css/variables.css">

<link rel="stylesheet"
href="../../assets/css/components.css">

<link rel="stylesheet"
href="../../assets/css/dashboard.css">

<link rel="stylesheet"
href="../../assets/css/view-user.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="preloader">

<div class="loader">

<img src="../../assets/images/logo/logo.png">

<div class="spinner"></div>

<h2>

Loading User Profile...

</h2>

</div>

</div>

<div class="dashboard">

<aside class="sidebar">

<!-- Same Sidebar -->

</aside>

<main class="mainContent">

<header class="topbar">

<div>

<h1>

User Profile

</h1>

<p>

View complete user information

</p>

</div>

</header>

<section class="profileCard">

<div class="profileHeader">

<img

id="profilePhoto"

src="../../assets/images/avatar.png"

alt="User Photo">

<div>

<h2 id="fullName">

Loading...

</h2>

<p id="userRole">

Role

</p>

<span id="userStatus">

Active

</span>

</div>

</div>

<div class="profileGrid">

<div>

<label>

Email Address

</label>

<p id="email">

-

</p>

</div>

<div>

<label>

Phone Number

</label>

<p id="phone">

-

</p>

</div>

<div>

<label>

Account Created

</label>

<p id="createdAt">

-

</p>

</div>

<div>

<label>

Last Login

</label>

<p id="lastLogin">

-

</p>

</div>

</div>

<div class="profileActions">

<button

id="editUser"

class="primaryButton">

<i class="fa-solid fa-pen"></i>

Edit User

</button>

<button

id="deleteUser"

class="secondaryButton">

<i class="fa-solid fa-trash"></i>

Delete User

</button>

</div>

</section>

<footer class="dashboardFooter">

<p>

© 2026 MathCloud Tutorial Academy. All Rights Reserved.

</p>

</footer>

</main>

</div>

<script type="module"
src="../../assets/js/view-user.js"></script>

<script type="module"
src="../../assets/js/theme.js"></script>

<script type="module"
src="../../assets/js/loader.js"></script>

<script type="module"
src="../../assets/js/sidebar.js"></script>

<script type="module"
src="../../assets/js/app.js"></script>

</body>

</html>
