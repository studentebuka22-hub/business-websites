<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Create User | MathCloud Tutorial Academy

</title>

<link rel="icon"
href="../../assets/images/logo/favicon.png">

<link rel="stylesheet"
href="../../assets/css/reset.css">

<link rel="stylesheet"
href="../../assets/css/variables.css">

<link rel="stylesheet"
href="../../assets/css/components.css">

<link rel="stylesheet"
href="../../assets/css/dashboard.css">

<link rel="stylesheet"
href="../../assets/css/create-user.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="preloader">

<div class="loader">

<img src="../../assets/images/logo/logo.png">

<div class="spinner"></div>

<h2>

Loading...

</h2>

</div>

</div>

<div class="dashboard">

<aside class="sidebar">

<!-- Use the same sidebar from dashboard.html -->

</aside>

<main class="mainContent">

<header class="topbar">

<div>

<h1>

Create New User

</h1>

<p>

Add a new system user

</p>

</div>

</header>

<section class="formCard">

<form id="createUserForm">

<div class="formGrid">

<div class="formGroup">

<label>

Full Name

</label>

<input

type="text"

id="fullName"

required

placeholder="Enter full name">

</div>

<div class="formGroup">

<label>

Email Address

</label>

<input

type="email"

id="email"

required

placeholder="Enter email address">

</div>

<div class="formGroup">

<label>

Phone Number

</label>

<input

type="tel"

id="phone"

placeholder="Enter phone number">

</div>

<div class="formGroup">

<label>

Role

</label>

<select id="role" required>

<option value="">

Select Role

</option>

<option>

Super Admin

</option>

<option>

Admin

</option>

<option>

Principal

</option>

<option>

Vice Principal

</option>

<option>

Teacher

</option>

<option>

Student

</option>

<option>

Parent

</option>

<option>

Accountant

</option>

<option>

Librarian

</option>

</select>

</div>

<div class="formGroup">

<label>

Password

</label>

<input

type="password"

id="password"

required

placeholder="Temporary password">

</div>

<div class="formGroup">

<label>

Confirm Password

</label>

<input

type="password"

id="confirmPassword"

required

placeholder="Confirm password">

</div>

</div>
  <!-- ==========================================================
pages/super-admin/create-user.html
Part 2
========================================================== -->

<div id="dynamicFields"></div>

<div class="permissionsCard">

<h2>

Account Status

</h2>

<div class="switchGrid">

<label class="switchItem">

<input
type="checkbox"
id="accountActive"
checked>

<span>

Activate Account

</span>

</label>

<label class="switchItem">

<input
type="checkbox"
id="emailVerified">

<span>

Mark Email as Verified

</span>

</label>

<label class="switchItem">

<input
type="checkbox"
id="forcePasswordChange"
checked>

<span>

Force Password Change on First Login

</span>

</label>

<label class="switchItem">

<input
type="checkbox"
id="sendWelcomeEmail">

<span>

Send Welcome Email

</span>

</label>

</div>

</div>

<div class="buttonGroup">

<button
type="reset"
class="secondaryButton">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

<button
type="submit"
class="primaryButton">

<i class="fa-solid fa-user-plus"></i>

Create User

</button>

</div>

</form>

</section>

</main>

</div>

<div id="toastContainer"></div>

<script
type="module"
src="../../assets/js/create-user.js"></script>

<script
type="module"
src="../../assets/js/sidebar.js"></script>

<script
type="module"
src="../../assets/js/theme.js"></script>

<script
type="module"
src="../../assets/js/loader.js"></script>

<script
type="module"
src="../../assets/js/router.js"></script>

</body>

</html>
