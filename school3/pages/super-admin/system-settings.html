<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

System Settings | MathCloud Tutorial Academy

</title>

<link rel="icon"
href="../../assets/images/logo/favicon.png">

<link rel="stylesheet"
href="../../assets/css/reset.css">

<link rel="stylesheet"
href="../../assets/css/variables.css">

<link rel="stylesheet"
href="../../assets/css/components.css">

<link rel="stylesheet"
href="../../assets/css/dashboard.css">

<link rel="stylesheet"
href="../../assets/css/system-settings.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<!-- Same Sidebar -->

</aside>

<main class="mainContent">

<header class="topbar">

<div>

<h1>

System Settings

</h1>

<p>

Configure global application settings

</p>

</div>

</header>

<section class="formCard">

<form id="systemSettingsForm">

<div class="formGroup">

<label>

Application Name

</label>

<input

type="text"

id="appName"

placeholder="MathCloud Tutorial Academy"

required>

</div>

<div class="formGroup">

<label>

Support Email

</label>

<input

type="email"

id="supportEmail"

placeholder="support@example.com"

required>

</div>

<div class="formGroup">

<label>

Support Phone

</label>

<input

type="text"

id="supportPhone"

placeholder="+234 XXX XXX XXXX">

</div>

<div class="formGroup">

<label>

School Address

</label>

<textarea

id="schoolAddress"

rows="4"

placeholder="Enter school address"></textarea>

</div>

<div class="formGroup">

<label>

Default Time Zone

</label>

<select id="timezone">

<option value="Africa/Lagos">

Africa/Lagos

</option>

<option value="UTC">

UTC

</option>

<option value="Europe/London">

Europe/London

</option>

<option value="America/New_York">

America/New_York

</option>

</select>

</div>

<div class="formActions">

<button

type="submit"

class="primaryButton">

Save Settings

</button>

</div>

</form>

</section>

</main>

</div>

<script type="module"
src="../../assets/js/system-settings.js"></script>

<script type="module"
src="../../assets/js/sidebar.js"></script>

<script type="module"
src="../../assets/js/theme.js"></script>

<script type="module"
src="../../assets/js/app.js"></script>

</body>

</html>
